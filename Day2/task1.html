<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASICS OF HTML</title>
</head>
<body>
    <!-- Create a heading and a paragraph inside the body. -->
     <h1>INTRODUCTION OG HTML</h1>
     <p>Lorem ipsum dolor sit amet.</p>

    <!-- Add a <div> containing two <p> elements. -->
        <div>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing.</p>
            <p>Lorem, ipsum dolor.</p>
        </div>

    <!-- Use a <span> inside a <p> to highlight a word. -->
        <p>html stands for<span>hyper text markup</span>language</p>

    <!-- Create an example showing block vs inline behavior. -->

                    <!-- block line -->
           <h2>THIS IA AN EXAMPLE FOR BLOCK LINE </h2>

                      <!-- inline  -->
            <p>This is an example for <b>INLINE</b> element. An inline element does not start on a new line.</p>



</body>
</html>
